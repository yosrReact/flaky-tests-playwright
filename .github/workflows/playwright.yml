name: E2E Playwright

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Run Playwright tests
        run: npx playwright test --grep-invert @quarantine
      - name: Warn on flaky tests
        if: ${{ !cancelled() }}
        run: |
          FLAKY=$(jq '.stats.flaky' results.json)
          if [ "$FLAKY" -gt 0 ]; then
            echo "::warning::$FLAKY flaky test(s) detected, see the HTML report"
          fi
      - name: Run quarantined tests (non-blocking)
        run: npx playwright test --grep @quarantine --reporter=list
        continue-on-error: true

      - name: Upload report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
